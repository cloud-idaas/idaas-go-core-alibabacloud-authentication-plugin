name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.18.x', 'stable']
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: plugin/go.sum

      - name: Check formatting
        working-directory: plugin
        run: test -z "$(gofmt -l .)"

      - name: Build
        working-directory: plugin
        run: go build ./...

      - name: Vet
        working-directory: plugin
        run: go vet ./...

      - name: Test with race detector
        working-directory: plugin
        run: go test -race -cover ./...

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: plugin/go.sum

      - name: Scan reachable vulnerabilities
        working-directory: plugin
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
